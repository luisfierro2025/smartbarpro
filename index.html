<div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Costo ($)</label>
                        <input type="number" step="0.01" id="prod-cost" placeholder="0.00" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Stock Actual *</label>
                        <input type="number" id="prod-stock" required placeholder="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Stock Mínimo</label>
                        <input type="number" id="prod-min-stock" placeholder="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                    </div>
                </div>

                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeModal('modal-product')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition">
                        Cancelar
                    </button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold transition shadow-lg shadow-purple-950/40">
                        Guardar Producto
                    </button>
                </div>
            </form>
        </div>
    </div>


    <!-- MODAL 4: NEW TABLE / AREA -->
    <div id="modal-table" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-white">Agregar Mesa / Ubicación</h3>
                <button onclick="closeModal('modal-table')" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="table-form" onsubmit="handleTableSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Nombre / Identificador *</label>
                    <input type="text" id="tbl-name" required placeholder="Ej. Mesa 12, Barra Principal, VIP 2" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Área / Zona *</label>
                    <select id="tbl-area" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500">
                        <option value="Principal">Salón Principal</option>
                        <option value="Barra">Barra</option>
                        <option value="Terraza">Terraza / Exterior</option>
                        <option value="VIP">Zona VIP</option>
                    </select>
                </div>

                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeModal('modal-table')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition">
                        Cancelar
                    </button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold transition shadow-lg shadow-rose-950/40">
                        Registrar Mesa
                    </button>
                </div>
            </form>
        </div>
    </div>


    <!-- PRINT RECEIPT TEMPLATE (HIDDEN UNTIL PRINT) -->
    <div id="printable-receipt" class="hidden">
        <div style="text-align: center; font-family: monospace; font-size: 12px;">
            <h2 style="font-size: 16px; margin: 0; font-weight: bold;">MeistrBar POS</h2>
            <p style="margin: 2px 0;">Comprobante de Consumo</p>
            <p id="print-date" style="margin: 2px 0;"></p>
            <hr style="border-dash: 1px dashed black; margin: 8px 0;">
            <p id="print-table" style="font-weight: bold; text-align: left; margin: 4px 0;"></p>
            <p id="print-method" style="text-align: left; margin: 4px 0;"></p>
            <hr style="border-dash: 1px dashed black; margin: 8px 0;">
            <div id="print-items" style="text-align: left; margin: 8px 0;"></div>
            <hr style="border-dash: 1px dashed black; margin: 8px 0;">
            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 14px;">
                <span>TOTAL:</span>
                <span id="print-total"></span>
            </div>
            <p style="margin-top: 15px;">¡Gracias por su visita!</p>
        </div>
    </div>

    <!-- Application JavaScript Engine -->
    <script>
        // ================= GLOBAL STATE =================
        let appState = {
            tables: [],
            menu: [],
            sales: [],
            activeTableId: null,
            selectedCategory: 'ALL',
            modalSelectedCategory: 'ALL',
            activePaymentMethod: 'Efectivo',
            splitPeople: 1
        };

        // Initialize app on DOM Load
        document.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            if (appState.tables.length === 0 && appState.menu.length === 0) {
                seedInitialData();
            } else {
                renderAllViews();
            }
            setupBroadcastChannel();
        });

        // Realtime Multi-Tab Sync with BroadcastChannel API
        let broadcastChannel;
        function setupBroadcastChannel() {
            if ('BroadcastChannel' in window) {
                broadcastChannel = new BroadcastChannel('meistrbar_sync_channel');
                broadcastChannel.onmessage = (event) => {
                    if (event.data && event.data.type === 'STATE_UPDATED') {
                        loadFromLocalStorage();
                        renderAllViews();
                        showToast('Datos sincronizados en tiempo real', 'info');
                    }
                };
            }
        }

        function notifyDataChange() {
            saveToLocalStorage();
            if (broadcastChannel) {
                broadcastChannel.postMessage({ type: 'STATE_UPDATED', timestamp: Date.now() });
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('meistrbar_tables', JSON.stringify(appState.tables));
            localStorage.setItem('meistrbar_menu', JSON.stringify(appState.menu));
            localStorage.setItem('meistrbar_sales', JSON.stringify(appState.sales));
        }

        function loadFromLocalStorage() {
            appState.tables = JSON.parse(localStorage.getItem('meistrbar_tables')) || [];
            appState.menu = JSON.parse(localStorage.getItem('meistrbar_menu')) || [];
            appState.sales = JSON.parse(localStorage.getItem('meistrbar_sales')) || [];
        }

        // Seed default initial demo dataset
        function seedInitialData() {
            appState.tables = [
                { id: 'tbl-1', name: 'Mesa 1', area: 'Principal', status: 'FREE', items: [] },
                { id: 'tbl-2', name: 'Mesa 2', area: 'Principal', status: 'OCCUPIED', items: [{ id: 'm-1', name: 'Cerveza Corona 355ml', price: 3.5, qty: 3 }, { id: 'm-4', name: 'Nachos Con Queso', price: 8.5, qty: 1 }] },
                { id: 'tbl-3', name: 'Mesa 3', area: 'Principal', status: 'FREE', items: [] },
                { id: 'tbl-4', name: 'Barra 1', area: 'Barra', status: 'OCCUPIED', items: [{ id: 'm-2', name: 'Mojito Cubano', price: 6.0, qty: 2 }] },
                { id: 'tbl-5', name: 'Barra 2', area: 'Barra', status: 'FREE', items: [] },
                { id: 'tbl-6', name: 'Terraza 1', area: 'Terraza', status: 'RESERVED', items: [] },
            ];

            appState.menu = [
                { id: 'm-1', name: 'Cerveza Corona 355ml', category: 'Cervezas', price: 3.50, cost: 1.50, stock: 48, minStock: 10 },
                { id: 'm-2', name: 'Mojito Cubano Standard', category: 'Tragos y Cocteles', price: 6.00, cost: 2.00, stock: 30, minStock: 5 },
                { id: 'm-3', name: 'Margarita Clásica', category: 'Tragos y Cocteles', price: 7.00, cost: 2.20, stock: 25, minStock: 5 },
                { id: 'm-4', name: 'Nachos Con Queso y Guacamole', category: 'Comida y Botanas', price: 8.50, cost: 3.00, stock: 15, minStock: 4 },
                { id: 'm-5', name: 'Hamburguesa Meistr Bar', category: 'Comida y Botanas', price: 11.00, cost: 4.50, stock: 8, minStock: 5 },
                { id: 'm-6', name: 'Botella Whisky Red Label', category: 'Botellas', price: 65.00, cost: 35.00, stock: 4, minStock: 2 },
                { id: 'm-7', name: 'Refresco Cola 500ml', category: 'Sin Alcohol', price: 2.50, cost: 0.80, stock: 3, minStock: 10 },
            ];

            notifyDataChange();
            renderAllViews();
            showToast('Datos iniciales de demostración cargados', 'success');
        }

        function renderAllViews() {
            renderTables();
            renderMenuItems();
            renderPOSView();
            renderSalesHistory();
            updateHeaderBadges();
        }

        // Navigation Handler
        function switchTab(tabName) {
            document.querySelectorAll('.tab-view').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-tab').forEach(el => {
                el.classList.remove('active', 'text-rose-400', 'bg-rose-500/10', 'border', 'border-rose-500/20');
                el.classList.add('text-slate-400');
            });

            const currentTab = document.getElementById(`tab-${tabName}`);
            currentTab.classList.add('active', 'text-rose-400', 'bg-rose-500/10', 'border', 'border-rose-500/20');
            currentTab.classList.remove('text-slate-400');

            document.getElementById(`view-${tabName}`).classList.remove('hidden');
        }

        function updateHeaderBadges() {
            const activeTables = appState.tables.filter(t => t.status === 'OCCUPIED').length;
            const badgeTables = document.getElementById('badge-active-tables');
            if (activeTables > 0) {
                badgeTables.textContent = activeTables;
                badgeTables.classList.remove('hidden');
            } else {
                badgeTables.classList.add('hidden');
            }

            const lowStockCount = appState.menu.filter(m => m.stock <= (m.minStock || 5)).length;
            const badgeStock = document.getElementById('badge-low-stock');
            if (lowStockCount > 0) {
                badgeStock.textContent = lowStockCount;
                badgeStock.classList.remove('hidden');
            } else {
                badgeStock.classList.add('hidden');
            }
        }

        // ================= TAB 1: MESAS LOGIC =================
        function renderTables() {
            const container = document.getElementById('tables-grid');
            const filter = document.getElementById('table-filter').value;
            container.innerHTML = '';

            const filtered = appState.tables.filter(t => filter === 'ALL' || t.status === filter);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full p-8 text-center text-slate-500">No hay mesas en este estado.</div>`;
                return;
            }

            filtered.forEach(table => {
                const totalBill = table.items.reduce((sum, item) => sum + (item.price * item.qty), 0);
                let statusColor = 'border-slate-700 bg-slate-900/60 text-slate-300';
                let badgeColor = 'bg-slate-800 text-slate-400 border-slate-700';
                let statusText = 'Disponible';

                if (table.status === 'OCCUPIED') {
                    statusColor = 'border-rose-500/50 bg-rose-950/20 text-rose-200';
                    badgeColor = 'bg-rose-500/20 text-rose-400 border-rose-500/30';
                    statusText = 'Ocupada';
                } else if (table.status === 'RESERVED') {
                    statusColor = 'border-amber-500/50 bg-amber-950/20 text-amber-200';
                    badgeColor = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
                    statusText = 'Reservada';
                }

                const card = document.createElement('div');
                card.className = `glass-card p-4 rounded-2xl border ${statusColor} transition hover:scale-[1.02] cursor-pointer flex flex-col justify-between h-44 relative group`;
                card.onclick = () => openOrderModal(table.id);

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400">${table.area}</span>
                            <h3 class="font-bold text-lg text-white">${table.name}</h3>
                        </div>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${badgeColor}">${statusText}</span>
                    </div>
                    
                    <div>
                        ${table.status === 'OCCUPIED' ? `
                            <p class="text-xs text-slate-400">${table.items.reduce((s, i) => s + i.qty, 0)} items consumidos</p>                             <p class="text-xl font-extrabold text-white mt-1">$${totalBill.toFixed(2)}</p>
                        ` : `
                            <p class="text-xs text-slate-500 italic">Haz clic para abrir pedido</p>
                        `}
                    </div>

                    <div class="flex gap-2 pt-2 border-t border-slate-800/80">
                        <button onclick="event.stopPropagation(); toggleTableStatus('${table.id}')" class="text-[11px] font-semibold text-slate-400 hover:text-white transition">
                            Cambiar Estado
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleTableStatus(tableId) {
            const table = appState.tables.find(t => t.id === tableId);
            if (!table) return;

            if (table.status === 'FREE') table.status = 'RESERVED';
            else if (table.status === 'RESERVED') table.status = 'FREE';
            else if (table.status === 'OCCUPIED' && table.items.length === 0) table.status = 'FREE';

            notifyDataChange();
            renderTables();
        }

        function openNewTableModal() {
            document.getElementById('table-form').reset();
            openModal('modal-table');
        }

        function handleTableSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('tbl-name').value.trim();
            const area = document.getElementById('tbl-area').value;

            if (!name) return;

            const newTable = {
                id: 'tbl-' + Date.now(),
                name,
                area,
                status: 'FREE',
                items: []
            };

            appState.tables.push(newTable);
            notifyDataChange();
            renderTables();
            closeModal('modal-table');
            showToast(`Mesa "${name}" agregada con éxito`, 'success');
        }

        // ================= ORDER / COMANDA MODAL LOGIC =================
        function openOrderModal(tableId) {
            appState.activeTableId = tableId;
            appState.splitPeople = 1;
            const table = appState.tables.find(t => t.id === tableId);

            document.getElementById('modal-table-badge').textContent = table.name;
            document.getElementById('modal-table-subtitle').textContent = `Área: ${table.area} | Estado: ${table.status}`;

            renderModalCategories();
            filterModalProducts();
            renderOrderCart();

            openModal('modal-order');
        }

        function renderModalCategories() {
            const container = document.getElementById('order-menu-categories');
            const categories = ['ALL', ...new Set(appState.menu.map(m => m.category))];

            container.innerHTML = categories.map(cat => `
                <button onclick="setModalCategory('${cat}')" class="px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition ${appState.modalSelectedCategory === cat ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-white'}">
                    ${cat === 'ALL' ? 'Todos' : cat}
                </button>
            `).join('');
        }

        function setModalCategory(cat) {
            appState.modalSelectedCategory = cat;
            renderModalCategories();
            filterModalProducts();
        }

        function filterModalProducts() {
            const search = document.getElementById('order-product-search').value.toLowerCase();
            const grid = document.getElementById('order-products-grid');

            const filtered = appState.menu.filter(prod => {
                const matchCat = appState.modalSelectedCategory === 'ALL' || prod.category === appState.modalSelectedCategory;
                const matchSearch = prod.name.toLowerCase().includes(search);
                return matchCat && matchSearch;
            });

            grid.innerHTML = filtered.map(item => `
                <div onclick="addItemToOrder('${item.id}')" class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-rose-500/50 hover:bg-slate-800/80 cursor-pointer transition flex flex-col justify-between">
                    <div>
                        <p class="text-xs font-semibold text-white line-clamp-1">${item.name}</p>
                        <span class="text-[10px] text-slate-400">Stock: ${item.stock}</span>
                    </div>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-xs font-bold text-rose-400">$${item.price.toFixed(2)}</span>
                        <span class="w-6 h-6 rounded-lg bg-rose-500/20 text-rose-400 flex items-center justify-center text-xs font-bold">+</span>
                    </div>
                </div>
            `).join('');
        }

        function addItemToOrder(prodId) {
            const table = appState.tables.find(t => t.id === appState.activeTableId);
            const prod = appState.menu.find(m => m.id === prodId);

            if (!table || !prod) return;

            if (prod.stock <= 0) {
                showToast(`Sin Stock suficiente para ${prod.name}`, 'warning');
                return;
            }

            const existing = table.items.find(i => i.id === prodId);
            if (existing) {
                if (existing.qty + 1 > prod.stock) {
                    showToast('Límite de Stock alcanzado', 'warning');
                    return;
                }
                existing.qty += 1;
            } else {
                table.items.push({
                    id: prod.id,
                    name: prod.name,
                    price: prod.price,
                    qty: 1
                });
            }

            if (table.status === 'FREE') table.status = 'OCCUPIED';

            renderOrderCart();
        }

        function changeItemQuantity(prodId, delta) {
            const table = appState.tables.find(t => t.id === appState.activeTableId);
            if (!table) return;

            const item = table.items.find(i => i.id === prodId);
            if (!item) return;

            item.qty += delta;
            if (item.qty <= 0) {
                table.items = table.items.filter(i => i.id !== prodId);
            }

            renderOrderCart();
        }

        function clearCurrentOrderItems() {
            const table = appState.tables.find(t => t.id === appState.activeTableId);
            if (table) table.items = [];
            renderOrderCart();
        }

        function renderOrderCart() {
            const table = appState.tables.find(t => t.id === appState.activeTableId);
            const cartContainer = document.getElementById('order-cart-items');
            if (!table) return;

            if (table.items.length === 0) {
                cartContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-48 text-slate-500">
                        <i class="fa-solid fa-martini-glass-empty text-3xl mb-2 opacity-50"></i>
                        <p class="text-xs">No hay consumo cargado</p>
                    </div>
                `;
            } else {
                cartContainer.innerHTML = table.items.map(item => `
                    <div class="p-2.5 rounded-xl bg-slate-950/60 border border-slate-800/80 flex items-center justify-between gap-2">
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-medium text-slate-200 truncate">${item.name}</p>
                            <p class="text-[11px] text-slate-400">$${item.price.toFixed(2)} c/u</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="flex items-center bg-slate-800 rounded-lg p-0.5 border border-slate-700">
                                <button onclick="changeItemQuantity('${item.id}', -1)" class="w-5 h-5 flex items-center justify-center text-slate-300 hover:text-white">-</button>
                                <span class="px-2 text-xs font-bold text-white">${item.qty}</span>
                                <button onclick="changeItemQuantity('${item.id}', 1)" class="w-5 h-5 flex items-center justify-center text-slate-300 hover:text-white">+</button>
                            </div>
                            <span class="text-xs font-bold text-slate-200 w-14 text-right">$${(item.price * item.qty).toFixed(2)}</span>
                        </div>
                    </div>
                `).join('');
            }

            const total = table.items.reduce((sum, i) => sum + (i.price * i.qty), 0);
            document.getElementById('order-total-price').textContent = `$${total.toFixed(2)}`;

            // Update split calculation
            const splitBox = document.getElementById('split-calculation-box');
            if (appState.splitPeople > 1 && total > 0) {
                splitBox.classList.remove('hidden');
                document.getElementById('split-amount-per-person').textContent = `$${(total / appState.splitPeople).toFixed(2)}`;
            } else {
                splitBox.classList.add('hidden');
            }
        }

        function adjustSplitPeople(delta) {
            appState.splitPeople = Math.max(1, appState.splitPeople + delta);
            document.getElementById('split-people-count').textContent = appState.splitPeople;
            renderOrderCart();
        }

        function saveCurrentOrderState() {
            const table = appState.tables.find(t => t.id === appState.activeTableId);
            if (table) {
                if (table.items.length === 0) {
                    table.status = 'FREE';
                } else {
                    table.status = 'OCCUPIED';
                }
            }
            notifyDataChange();
            renderAllViews();
            closeModal('modal-order');
            showToast('Pedido guardado correctamente', 'success');
        }

        // ================= CHECKOUT & PAYMENT LOGIC =================
        function openCheckoutModal(tableId = null) {
            if (tableId) appState.activeTableId = tableId;

            const table = appState.tables.find(t => t.id === appState.activeTableId);
            if (!table || table.items.length === 0) {
                showToast('No hay consumo registrado en esta mesa', 'warning');
                return;
            }

            const total = table.items.reduce((s, i) => s + (i.price * i.qty), 0);
            document.getElementById('checkout-total-display').textContent = `$${total.toFixed(2)}`;
            document.getElementById('cash-given-input').value = '';
            document.getElementById('cash-change-display').textContent = '$0.00';

            selectPaymentMethod('Efectivo');
            openModal('modal-checkout');
        }

        function selectPaymentMethod(method) {
            appState.activePaymentMethod = method;
            document.querySelectorAll('.payment-method-btn').forEach(btn => {
                btn.classList.remove('border-emerald-500', 'bg-emerald-500/10', 'text-emerald-400');
                btn.classList.add('border-slate-800', 'bg-slate-900', 'text-slate-400');
            });

            const selectedBtn = document.getElementById(`pay-btn-${method}`);
            selectedBtn.classList.add('border-emerald-500', 'bg-emerald-500/10', 'text-emerald-400');

            const cashCalc = document.getElementById('cash-calculator-box');
            if (method === 'Efectivo') cashCalc.classList.remove('hidden');
            else cashCalc.classList.add('hidden');
        }

        function calculateChange() {
            const table = appState.tables.find(t => t.id === appState.activeTableId);
            if (!table) return;

            const total = table.items.reduce((s, i) => s + (i.price * i.qty), 0);
            const given = parseFloat(document.getElementById('cash-given-input').value) || 0;
            const change = given - total;

            const changeDisplay = document.getElementById('cash-change-display');
            if (change >= 0) {
                changeDisplay.textContent = `$${change.toFixed(2)}`;
                changeDisplay.className = 'text-lg font-extrabold text-emerald-400';
            } else {
                changeDisplay.textContent = 'Faltante';
                changeDisplay.className = 'text-lg font-extrabold text-rose-500';
            }
        }

        function processFinalPayment() {
            const table = appState.tables.find(t => t.id === appState.activeTableId);
            if (!table || table.items.length === 0) return;

            const total = table.items.reduce((s, i) => s + (i.price * i.qty), 0);

            // Deduct Inventory Stock
            table.items.forEach(orderItem => {
                const menuProd = appState.menu.find(m => m.id === orderItem.id);
                if (menuProd) {
                    menuProd.stock = Math.max(0, menuProd.stock - orderItem.qty);
                }
            });

            // Create Sale Transaction Record
            const saleRecord = {
                id: 'sale-' + Date.now(),
                date: new Date().toISOString(),
                tableName: table.name,
                method: appState.activePaymentMethod,
                total: total,
                items: [...table.items]
            };

            appState.sales.unshift(saleRecord);

            // Reset Table
            table.items = [];
            table.status = 'FREE';

            notifyDataChange();
            renderAllViews();

            closeModal('modal-checkout');
            closeModal('modal-order');

            triggerPrintReceipt(saleRecord);
            showToast('Cobro procesado e inventario actualizado', 'success');
        }

        function triggerPrintReceipt(sale) {
            document.getElementById('print-date').textContent = new Date(sale.date).toLocaleString('es-ES');
            document.getElementById('print-table').textContent = `Mesa: ${sale.tableName}`;
            document.getElementById('print-method').textContent = `Pago: ${sale.method}`;
            document.getElementById('print-total').textContent = `$${sale.total.toFixed(2)}`;

            document.getElementById('print-items').innerHTML = sale.items.map(i => `
                <div style="display:flex; justify-content:space-between; margin-bottom: 2px;">
                    <span>${i.qty}x ${i.name}</span>
                    <span>$${(i.price * i.qty).toFixed(2)}</span>
                </div>
            `).join('');

            window.print();
        }

        // ================= TAB 2: MENÚ E INVENTARIO LOGIC =================
        function renderMenuItems() {
            const container = document.getElementById('menu-items-grid');
            const categoryContainer = document.getElementById('category-filters');
            const search = document.getElementById('menu-search').value.toLowerCase();

            // Render Category Pills
            const categories = ['ALL', ...new Set(appState.menu.map(m => m.category))];
            categoryContainer.innerHTML = categories.map(cat => `
                <button onclick="setMenuFilterCategory('${cat}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition ${appState.selectedCategory === cat ? 'bg-purple-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-400 hover:text-white'}">
                    ${cat === 'ALL' ? 'Todos los Productos' : cat}
                </button>
            `).join('');

            // Filter items
            const filtered = appState.menu.filter(item => {
                const matchCategory = appState.selectedCategory === 'ALL' || item.category === appState.selectedCategory;
                const matchSearch = item.name.toLowerCase().includes(search);
                return matchCategory && matchSearch;
            });

            container.innerHTML = '';
            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full p-8 text-center text-slate-500">No se encontraron productos en el inventario.</div>`;
                return;
            }

            filtered.forEach(item => {
                const isLowStock = item.stock <= (item.minStock || 5);
                const card = document.createElement('div');
                card.className = `glass-card p-4 rounded-2xl border ${isLowStock ? 'border-amber-500/40 bg-amber-950/10' : 'border-slate-800'} space-y-3 flex flex-col justify-between`;

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2">
                            <span class="text-[10px] uppercase font-bold text-purple-400 bg-purple-500/10 px-2 py-0.5 rounded-md border border-purple-500/20">${item.category}</span>
                            ${isLowStock ? `<span class="text-[10px] uppercase font-bold text-amber-400 bg-amber-500/20 px-2 py-0.5 rounded-md border border-amber-500/30">Stock Bajo</span>` : ''}
                        </div>
                        <h4 class="font-bold text-white text-base mt-2">${item.name}</h4>
                    </div>

                    <div class="grid grid-cols-3 gap-2 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 text-center">
                        <div>
                            <span class="text-[10px] text-slate-400 block">Precio</span>
                            <span class="text-sm font-bold text-white">$${item.price.toFixed(2)}</span>
                        </div>
                        <div>
                            <span class="text-[10px] text-slate-400 block">Costo</span>
                            <span class="text-sm font-semibold text-slate-300">$${(item.cost || 0).toFixed(2)}</span>
                        </div>
                        <div>
                            <span class="text-[10px] text-slate-400 block">Stock</span>
                            <span class="text-sm font-bold ${isLowStock ? 'text-amber-400' : 'text-emerald-400'}">${item.stock}</span>
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-1">
                        <button onclick="openProductModal('${item.id}')" class="text-xs text-purple-400 hover:text-purple-300 font-semibold flex items-center gap-1">
                            <i class="fa-solid fa-pen-to-square"></i> Editar
                        </button>
                        <button onclick="deleteProduct('${item.id}')" class="text-xs text-rose-400 hover:text-rose-300 font-semibold flex items-center gap-1">
                            <i class="fa-solid fa-trash"></i> Eliminar
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function setMenuFilterCategory(cat) {
            appState.selectedCategory = cat;
            renderMenuItems();
        }

        function openProductModal(prodId = null) {
            const form = document.getElementById('product-form');
            form.reset();

            if (prodId) {
                const prod = appState.menu.find(m => m.id === prodId);
                if (prod) {
                    document.getElementById('product-id').value = prod.id;
                    document.getElementById('prod-name').value = prod.name;
                    document.getElementById('prod-category').value = prod.category;
                    document.getElementById('prod-price').value = prod.price;
                    document.getElementById('prod-cost').value = prod.cost || 0;
                    document.getElementById('prod-stock').value = prod.stock;
                    document.getElementById('prod-min-stock').value = prod.minStock || 5;
                    document.getElementById('product-modal-title').textContent = 'Editar Producto';
                }
            } else {
                document.getElementById('product-id').value = '';
                document.getElementById('product-modal-title').textContent = 'Agregar Nuevo Producto';
            }

            openModal('modal-product');
        }

        function handleProductSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('product-id').value;
            const name = document.getElementById('prod-name').value.trim();
            const category = document.getElementById('prod-category').value;
            const price = parseFloat(document.getElementById('prod-price').value) || 0;
            const cost = parseFloat(document.getElementById('prod-cost').value) || 0;
            const stock = parseInt(document.getElementById('prod-stock').value) || 0;
            const minStock = parseInt(document.getElementById('prod-min-stock').value) || 5;

            if (id) {
                const prod = appState.menu.find(m => m.id === id);
                if (prod) {
                    prod.name = name;
                    prod.category = category;
                    prod.price = price;
                    prod.cost = cost;
                    prod.stock = stock;
                    prod.minStock = minStock;
                }
            } else {
                appState.menu.push({
                    id: 'm-' + Date.now(),
                    name, category, price, cost, stock, minStock
                });
            }

            notifyDataChange();
            renderAllViews();
            closeModal('modal-product');
            showToast('Producto guardado correctamente', 'success');
        }

        function deleteProduct(prodId) {
            if (confirm('¿Está seguro de eliminar este producto del menú?')) {
                appState.menu = appState.menu.filter(m => m.id !== prodId);
                notifyDataChange();
                renderAllViews();
                showToast('Producto eliminado', 'info');
            }
        }

        // ================= TAB 3: CAJA Y VENTA RÁPIDA LOGIC =================
        function renderPOSView() {
            const totalSales = appState.sales.reduce((s, x) => s + x.total, 0);
            const openAccounts = appState.tables.reduce((s, t) => s + t.items.reduce((si, i) => si + (i.price * i.qty), 0), 0);
            const cashSales = appState.sales.filter(s => s.method === 'Efectivo').reduce((s, x) => s + x.total, 0);
            const digitalSales = appState.sales.filter(s => s.method !== 'Efectivo').reduce((s, x) => s + x.total, 0);

            document.getElementById('pos-total-revenue').textContent = `$${totalSales.toFixed(2)}`;
            document.getElementById('pos-sales-count').textContent = appState.sales.length;
            document.getElementById('pos-open-accounts').textContent = `$${openAccounts.toFixed(2)}`;
            document.getElementById('pos-active-tables-count').textContent = appState.tables.filter(t => t.status === 'OCCUPIED').length;
            document.getElementById('pos-cash-total').textContent = `$${cashSales.toFixed(2)}`;
            document.getElementById('pos-digital-total').textContent = `$${digitalSales.toFixed(2)}`;

            const tbody = document.getElementById('pos-tables-tbody');
            const activeTables = appState.tables.filter(t => t.items.length > 0);

            if (activeTables.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-6 text-center text-slate-500">No hay cuentas ni mesas abiertas actualmente.</td></tr>`;
                return;
            }

            tbody.innerHTML = activeTables.map(t => {
                const total = t.items.reduce((s, i) => s + (i.price * i.qty), 0);
                const itemCount = t.items.reduce((s, i) => s + i.qty, 0);
                return `
                    <tr class="hover:bg-slate-800/30 transition">
                        <td class="px-4 py-3 font-bold text-white">${t.name} <span class="text-[10px] text-slate-400 font-normal">(${t.area})</span></td>
                        <td class="px-4 py-3 text-slate-300">${itemCount} productos</td>
                        <td class="px-4 py-3 font-bold text-rose-400">$${total.toFixed(2)}</td>
                        <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30">Ocupada</span></td>
                        <td class="px-4 py-3 text-right">
                            <button onclick="openCheckoutModal('${t.id}')" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs transition">
                                Cobrar
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ================= TAB 4: HISTORIAL Y REPORTES LOGIC =================
        function renderSalesHistory() {
            const tbody = document.getElementById('sales-history-tbody');
            const search = document.getElementById('sales-search').value.toLowerCase();

            const filteredSales = appState.sales.filter(s =>
                s.tableName.toLowerCase().includes(search) ||
                s.method.toLowerCase().includes(search)
            );

            if (filteredSales.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-3 py-6 text-center text-slate-500">No hay registros de ventas.</td></tr>`;
            } else {
                tbody.innerHTML = filteredSales.map(s => `
                    <tr class="hover:bg-slate-800/30 transition border-b border-slate-800/40">
                        <td class="px-3 py-2.5 text-slate-400">${new Date(s.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
                        <td class="px-3 py-2.5 font-semibold text-white">${s.tableName}</td>
                        <td class="px-3 py-2.5"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${s.method === 'Efectivo' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-cyan-500/10 text-cyan-400'}">${s.method}</span></td>
                        <td class="px-3 py-2.5 font-bold text-emerald-400">$${s.total.toFixed(2)}</td>
                        <td class="px-3 py-2.5 text-right">
                            <button onclick="triggerPrintReceipt(appState.sales.find(x => x.id === '${s.id}'))" class="text-slate-400 hover:text-white transition">
                                <i class="fa-solid fa-print"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            }

            renderTopProducts();
        }

        function renderTopProducts() {
            const container = document.getElementById('top-products-list');
            const itemCounts = {};

            appState.sales.forEach(sale => {
                sale.items.forEach(item => {
                    itemCounts[item.name] = (itemCounts[item.name] || 0) + item.qty;
                });
            });

            const sorted = Object.entries(itemCounts).sort((a, b) => b[1] - a[1]);

            if (sorted.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 italic">No hay suficientes datos de venta</p>`;
                return;
            }

            container.innerHTML = sorted.slice(0, 5).map(([name, qty], index) => `
                <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-950/60 border border-slate-800">
                    <div class="flex items-center gap-2">
                        <span class="w-5 h-5 rounded-full bg-amber-500/20 text-amber-400 font-bold text-[10px] flex items-center justify-center border border-amber-500/30">
                            ${index + 1}
                        </span>
                        <span class="text-xs font-semibold text-slate-200">${name}</span>
                    </div>
                    <span class="text-xs font-bold text-amber-400">${qty} vendidos</span>
                </div>
            `).join('');
        }

        function exportSalesToCSV() {
            if (appState.sales.length === 0) {
                showToast('No hay historial de ventas para exportar', 'warning');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,ID,Fecha,Mesa,Metodo,Total\n";
            appState.sales.forEach(s => {
                csvContent += `${s.id},"${new Date(s.date).toLocaleString()}","${s.tableName}",${s.method},${s.total}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `reporte_ventas_meistrbar_${Date.now()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearSalesHistoryConfirm() {
            if (confirm('¿Desea eliminar de forma permanente todo el historial de ventas?')) {
                appState.sales = [];
                notifyDataChange();
                renderAllViews();
                showToast('Historial de ventas limpiado', 'info');
            }
        }

        // ================= HELPERS & TOAST SYSTEM =================
        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            let bg = 'bg-slate-800 border-slate-700 text-white';
            if (type === 'success') bg = 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200';
            if (type === 'warning') bg = 'bg-amber-950/90 border-amber-500/50 text-amber-200';

            toast.className = `p-3 rounded-xl border ${bg} backdrop-blur-md shadow-xl text-xs font-medium flex items-center justify-between pointer-events-auto transition duration-300 transform translate-y-2`;
            toast.innerHTML = `
                <span>${message}</span>
                <button onclick="this.parentElement.remove()" class="ml-3 text-slate-400 hover:text-white">&times;</button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 4000);
        }
    </script>
</body>
</html>
